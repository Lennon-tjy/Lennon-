<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .lunbotu {
        width: 500px;
        height: 380px;
        overflow: hidden;
        /* background-color: pink; */
      }

      .imgs {
        width: 100%;
        height: 320px;
      }

      .imgs img {
        display: block;
        width: 100%;
        height: 100%;
        /* object-fit: cover; */
      }

      .footer {
        position: relative;
        height: 60px;
        background: rgba(100, 67, 68);
        padding: 12px 12px 0 12px;
      }

      .arrow {
        position: absolute;
        right: 12px;
        top: 12px;
        display: flex;
        gap: 12px;
      }

      .prev,
      .next {
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        transition: all 0.2s ease-in-out;
      }

      .prev svg,
      .next svg {
        width: 90%;
        height: 90%;
        fill: #fff;
        cursor: pointer;
      }

      .prev:hover,
      .next:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      .footer p {
        margin: 0;
        color: #fff;
        font-size: 15px;
        margin-bottom: 10px;
      }

      .dots {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        list-style: none;
      }

      .dots li {
        width: 8px;
        height: 8px;
        background-color: #fff;
        border-radius: 50%;
        cursor: pointer;
        opacity: 0.5;
      }

      .dots .active {
        box-shadow: 0 0 0 2px #fff;
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div class="lunbotu">
      <div class="imgs">
        <img src="../../img/山水湖色.jpg" alt="" />
      </div>
      <div class="footer">
        <p>山水湖色</p>
        <div class="arrow">
          <div class="prev">
            <svg
              t="1775451002201"
              class="icon"
              viewBox="0 0 1024 1024"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              p-id="3631"
              xmlns:xlink="http://www.w3.org/1999/xlink"
            >
              <path
                d="M384 512l347.733-309.333C748.8 187.733 750.933 160 736 142.933c-14.933-17.066-42.667-19.2-59.733-4.266L292.267 480c-10.667 8.533-14.934 19.2-14.934 32s4.267 23.467 14.934 32l384 341.333C684.8 891.733 695.467 896 704 896c12.8 0 23.467-4.267 32-14.933 14.933-17.067 14.933-44.8-4.267-59.734L384 512z"
                p-id="3632"
              ></path>
            </svg>
          </div>

          <div class="next">
            <svg
              t="1775451975625"
              class="icon"
              viewBox="0 0 1024 1024"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              p-id="4769"
              xmlns:xlink="http://www.w3.org/1999/xlink"
            >
              <path
                d="M731.733333 480l-384-341.333333c-17.066667-14.933333-44.8-14.933333-59.733333 4.266666-14.933333 17.066667-14.933333 44.8 4.266667 59.733334L640 512 292.266667 821.333333c-17.066667 14.933333-19.2 42.666667-4.266667 59.733334 8.533333 8.533333 19.2 14.933333 32 14.933333 10.666667 0 19.2-4.266667 27.733333-10.666667l384-341.333333c8.533333-8.533333 14.933333-19.2 14.933334-32s-4.266667-23.466667-14.933334-32z"
                p-id="4770"
              ></path>
            </svg>
          </div>
        </div>

        <ul class="dots">
          <li class="active"></li>
          <li></li>
          <li></li>
          <li></li>
        </ul>
      </div>
    </div>

    <script>
      //定义数组对象
      const ArrImgs = [
        {
          img: "../../img/落日夕阳.jpg",
          title: "落日夕阳",
          color: "rgb(100,67,68)",
        },
        {
          img: "../../img/广阔蓝海.jpg",
          title: "广阔蓝海",
          color: "rgb(99,72,114)",
        },
        {
          img: "../../img/山水湖色.jpg",
          title: "山水湖色",
          color: "rgb(139,98,66)",
        },
        {
          img: "../../img/白雪蓝天.jpg",
          title: "白雪蓝天",
          color: "rgb(166,131,143)",
        },
      ];

      //获取
      const img = document.querySelector(".imgs img");
      const p = document.querySelector(".footer p");
      const footer = document.querySelector(".footer");

      //开启定时器
      let i = 0;
      setInterval(function () {
        i++;
        //在这个位置增加判断
        if (i >= ArrImgs.length) {
          i = 0;
        }
        //更换图片路径
        img.src = ArrImgs[i].img;
        //更换标题
        p.textContent = ArrImgs[i].title;
        //更换颜色
        footer.style.backgroundColor = ArrImgs[i].color;
        //更换小圆点
        //先删除之前的小圆点
        document.querySelector(".dots .active").classList.remove("active");
        //再添加当前小圆点
        document
          .querySelector(`.dots li:nth-child(${i + 1})`)
          .classList.add("active");
      }, 2000);
    </script>
  </body>
</html>
