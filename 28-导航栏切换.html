<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab栏切换</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .tab {
        width: 590px;
        height: 340px;
        margin: 20px;
        border: 1px solid #e4e4e4;
      }

      .tab-nav {
        width: 100%;
        height: 60px;
        line-height: 60px;
        display: flex;
        justify-content: space-between;
      }

      .tab-nav h3 {
        font-size: 24px;
        font-weight: normal;
        margin-left: 20px;
      }

      .tab-nav ul {
        list-style: none;
        display: flex;
        justify-content: flex-end;
      }

      .tab-nav ul li {
        margin: 0 20px;
        font-size: 14px;
      }

      .tab-nav ul li a {
        text-decoration: none;
        border-bottom: 2px solid transparent;
        color: #333;
      }

      .tab-nav ul li a.active {
        border-color: #e1251b;
        color: #e1251b;
      }

      .tab-content {
        padding: 0 16px;
      }

      .tab-content .item {
        display: none;
      }

      .tab-content .item.active {
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="tab">
      <div class="tab-nav">
        <h3>每日特价</h3>
        <ul>
          <li><a class="active" href="javascript:;">精选</a></li>
          <li><a href="javascript:;">美食</a></li>
          <li><a href="javascript:;">百货</a></li>
          <li><a href="javascript:;">个护</a></li>
          <li><a href="javascript:;">预告</a></li>
        </ul>
      </div>

      <div class="tab-content">
        <div class="item active">
          <img src="../../img/导航栏1.png" alt="" />
        </div>
        <div class="item"><img src="../../img/导航栏2.png" alt="" /></div>
        <div class="item"><img src="../../img/导航栏3.png" alt="" /></div>
        <div class="item"><img src="../../img/导航栏4.png" alt="" /></div>
        <div class="item"><img src="../../img/导航栏5.png" alt="" /></div>
      </div>
    </div>

    <script>
      //导航栏模块
      const nav = document.querySelectorAll(".tab-nav a");
      // console.log(nav);
      //给五个a绑定鼠标经过事件
      for (let i = 0; i < nav.length; i++) {
        nav[i].addEventListener("mouseenter", function () {
          //去除
          document.querySelector(".tab-nav .active").classList.remove("active");
          //添加
          this.classList.add("active");

          //五个大盒子模块
          //去除
          document
            .querySelector(".tab-content .active")
            .classList.remove("active");
          //对应序号添加active
          document
            .querySelector(`.tab-content .item:nth-child(${i + 1})`)
            .classList.add("active");
        });
      }
    </script>
  </body>
</html>
