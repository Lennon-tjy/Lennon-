<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 840px;
        height: 420px;
        margin: 0 auto;
        background: url(https://bpic.588ku.com/back_pic/03/16/76/5965854b3fdf38f.jpg)
          no-repeat center center;
        background-size: cover;
      }

      .container strong {
        color: yellow;
        font-size: 30px;
      }

      .container h1 {
        margin: 15px 0;
      }

      .container h3 {
        font-size: 21px;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <strong>传智教育年会抽奖</strong>
      <h1>一等奖：<span id="first"></span></h1>
      <h2>二等奖：<span id="second"></span></h2>
      <h3>三等奖：<span id="third"></span></h3>
    </div>

    <script>
      const personArr = ["周星驰", "周杰伦", "刘德华", "张学友", "雷军"];

      //一等奖
      const random1 = Math.floor(Math.random() * personArr.length);
      console.log(personArr[random1]);

      const first = document.querySelector("#first");
      first.innerHTML = personArr[random1];
      personArr.splice(random1, 1);

      //二等奖
      const random2 = Math.floor(Math.random() * personArr.length);
      console.log(personArr[random2]);

      const second = document.querySelector("#second");
      second.innerHTML = personArr[random2];
      personArr.splice(random2, 1);

      //三等奖
      const random3 = Math.floor(Math.random() * personArr.length);
      console.log(personArr[random3]);

      const third = document.querySelector("#third");
      third.innerHTML = personArr[random3];
      personArr.splice(random3, 1);
    </script>
  </body>
</html>
