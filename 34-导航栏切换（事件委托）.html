<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab栏切换</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .tab {
        width: 590px;
        height: 340px;
        margin: 20px;
        border: 1px solid #e4e4e4;
      }

      .tab-nav {
        width: 100%;
        height: 60px;
        line-height: 60px;
        display: flex;
        justify-content: space-between;
      }

      .tab-nav h3 {
        font-size: 24px;
        font-weight: normal;
        margin-left: 20px;
      }

      .tab-nav ul {
        list-style: none;
        display: flex;
        justify-content: flex-end;
      }

      .tab-nav ul li {
        margin: 0 20px;
        font-size: 14px;
      }

      .tab-nav ul li a {
        text-decoration: none;
        border-bottom: 2px solid transparent;
        color: #333;
      }

      .tab-nav ul li a.active {
        border-color: #e1251b;
        color: #e1251b;
      }

      .tab-content {
        padding: 0 16px;
      }

      .tab-content .item {
        display: none;
      }

      .tab-content .item.active {
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="tab">
      <div class="tab-nav">
        <h3>每日特价</h3>
        <ul>
          <li><a class="active" href="javascript:;" data-id="0">精选</a></li>
          <li><a href="javascript:;" data-id="1">美食</a></li>
          <li><a href="javascript:;" data-id="2">百货</a></li>
          <li><a href="javascript:;" data-id="3">个护</a></li>
          <li><a href="javascript:;" data-id="4">预告</a></li>
        </ul>
      </div>

      <div class="tab-content">
        <div class="item active">
          <img src="../../img/导航栏1.png" alt="" />
        </div>
        <div class="item"><img src="../../img/导航栏2.png" alt="" /></div>
        <div class="item"><img src="../../img/导航栏3.png" alt="" /></div>
        <div class="item"><img src="../../img/导航栏4.png" alt="" /></div>
        <div class="item"><img src="../../img/导航栏5.png" alt="" /></div>
      </div>
    </div>

    <script>
      //采取事件委托
      //获取
      const ul = document.querySelector(".tab-nav ul");
      //添加事件
      ul.addEventListener("click", function (e) {
        if (e.target.tagName === "A") {
          //先去除
          document.querySelector(".tab-nav .active").classList.remove("active");
          //再添加
          e.target.classList.add("active");

          //大盒子模块
          // console.log(e.target.dataset.id); //获得点击的a标签的id属性值
          const i = +e.target.dataset.id;
          //先去除
          document
            .querySelector(".tab-content .active")
            .classList.remove("active");
          //再添加
          document
            .querySelector(`.tab-content .item:nth-child(${i + 1})`)
            .classList.add("active");
        }
      });
    </script>
  </body>
</html>
