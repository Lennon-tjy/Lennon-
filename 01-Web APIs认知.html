<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>123</div>

    <script>
      //JavaScript分为 ECMAScript 和 Web APIs
      //ECMAScript是JS的语法，Web APIs是JS的功能拓展
      //Web APIs又分为DOM和BOM，DOM操作网页内容（如document.），BOM操作浏览器本身（如alert()）

      const div = document.querySelector("div");
      //打印对象
      console.dir(div); //这个div在html里面叫标签，获取过来后叫对象，dom对象
      //  console.log(typeof div);//object
    </script>
  </body>
</html>
