<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .father {
        width: 200px;
        height: 200px;
        background-color: pink;
      }

      .son {
        width: 100px;
        height: 100px;
        background-color: skyblue;
      }
    </style>
  </head>

  <body>
    <div class="father">
      <div class="son"></div>
    </div>
    <script>
      //事件捕获：从dom根元素开始去执行'同名'事件
      const father = document.querySelector(".father");
      const son = document.querySelector(".son");

      //点击son/father/document后会依次从外到里执行
      document.addEventListener(
        "click",
        function () {
          alert("点击了根元素");
        },
        true,
      ); //添加true，开启捕获机制

      father.addEventListener(
        "click",
        function () {
          alert("点击了父元素");
        },
        true,
      );

      son.addEventListener(
        "click",
        function () {
          alert("点击了子元素");
        },
        true,
      );
    </script>
  </body>
</html>
