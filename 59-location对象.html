<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- location.search -->
    <form action="">
      <input type="text" name="uname" autocomplete="off" />
      <input type="password" name="pwd" autocomplete="off" />
      <!-- 点击后是页面刷新，不是自动清空 -->
      <button>提交</button>
    </form>

    <!-- 使用这种，点击后不会跳转，只是改变url地址，加载更少 -->
    <a href="#/my">我的</a>
    <a href="#/friend">好友</a>
    <a href="#/download">下载</a>
    <button class="reload">刷新</button>

    <script>
      //location对象：其拆分并保存了url地址的各个组成部分
      // console.log(location);
      // console.log(location.href); //获取链接，可利用此方式进行页面跳转
      // location.href = "https://www.baidu.com"; //自动跳转

      //点击button后填入的数据会提交到网址上，通过location.seacrh获取
      console.log(location.search);

      //通过location.hash获取当前点击的a标签的hash值
      console.log(location.hash);

      //location方法：reload()刷新当前页面
      const reload = document.querySelector(".reload");

      reload.addEventListener("click", function () {
        location.reload(); //刷新页面
        location.reload(true); //强制刷新
      });
    </script>
  </body>
</html>
