<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仿优医问诊</title>
    <link rel="icon" href="./优医问诊favicon.ico" />
    <!-- rem单位是只跟着根元素（html）的字体大小（设置为了1rem）变化的单位 -->
    <!-- Alt+z可以将px转为rem -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      a {
        text-decoration: none;
      }

      body {
        padding-top: 11.733vmin;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", sans-serif;
      }

      :root {
        --text1: #121826;
        --text2: #3c3e42;
        --text3: #848484;
        --text4: #c3c3c5;
        --text-green: #16c2a3;
      }

      .nav-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        height: 11.733vmin;
        background-color: #fff;
        z-index: 999;
        box-shadow: 0 0 0.1333rem rgba(0, 0, 0, 0.1);
      }

      .nav-bar .back {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 11.733vmin;
        height: 11.733vmin;
        cursor: pointer;
      }

      .nav-bar .back svg {
        width: 4.533vmin;
        height: 4.533vmin;
      }

      .nav-bar .zhuce {
        width: 11.733vmin;
        height: 11.733vmin;
        font-size: 4.533vmin;
        color: var(--text-green);
        text-align: center;
        line-height: 11.733vmin;
        margin-right: 4vmin;
      }

      /* 头部制作 */
      .header {
        padding: 6.667vmin 4vmin 12vmin;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .header h1 {
        font-size: 6.4vmin;
        color: var(--text1);
        font-weight: 500;
      }

      .header a {
        color: var(--text2);
        font-size: 4vmin;
        display: flex;
        align-items: center;
        gap: 0.8vmin;
      }

      .header a svg {
        width: 4.267vmin;
        height: 4.267vmin;
      }

      /* form表单制作 */
      .form {
        padding: 0 4vmin;
      }

      .shuru {
        padding: 4vmin 0;
        border-bottom: 0.267vmin solid #ededede5;
      }

      .mima {
        display: flex;
        justify-content: space-between;
      }

      .shuru input {
        font-size: 3.733vmin;
        border: none;
        outline: none;
      }

      .shuru input::placeholder {
        color: var(--text4);
      }

      .shuru svg {
        width: 4vmin;
        height: 4vmin;
        cursor: pointer;
      }

      .tongyi {
        display: flex;
        align-items: center;
        gap: 1.333vmin;
        padding: 4vmin 0;
        font-size: 3.467vmin;
        color: var(--text2);
      }

      .tongyi svg {
        width: 3.467vmin;
        height: 3.467vmin;
        cursor: pointer;
      }

      .tongyi a {
        color: var(--text-green);
      }

      button {
        width: 100%;
        height: 11.733vmin;
        border-radius: 5.867vmin;
        border: none;
        background-color: #fafafa;
        color: #d9dbde;
        font-size: 4.267vmin;
        cursor: pointer;
      }

      .forget {
        padding-top: 4vmin;
        text-align: center;
        font-size: 3.733vmin;
      }

      .forget a {
        color: var(--text3);
      }

      /* 第三方登录制作 */
      .third-login {
        width: 53.333vmin;
        margin: 53.333vmin auto 18.667vmin;
        /* background-color: pink; */
      }

      .third-login p {
        display: flex;
        justify-content: center;
        height: 4.8vmin;
        align-items: center;
      }

      .third-login p::before,
      .third-login p::after {
        content: "";
        flex: 1;
        height: 0.267vmin;
        background-color: var(--text4);
      }

      .third-login p span {
        width: 24vmin;
        font-size: 3.2vmin;
        text-align: center;
        color: var(--text3);
      }

      .third-login a svg {
        display: block;
        width: 8vmin;
        height: 8vmin;
        margin: 4vmin auto;
      }
    </style>
  </head>

  <body>
    <!-- 顶部制作 -->
    <div class="nav-bar">
      <div class="back">
        <a href="./仿优医问诊.html">
          <svg
            t="1773984055230"
            class="icon"
            viewBox="0 0 1024 1024"
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
            p-id="5315"
            xmlns:xlink="http://www.w3.org/1999/xlink"
          >

              fill="#030000"
              p-id="5316"
            ></path>
          </svg>
        </a>
      </div>
      <a href="#" class="zhuce">注册</a>
    </div>

    <!-- 头部制作 -->
    <div class="header">
      <h1>密码登录</h1>
      <a href="#"
        >手机验证码登录
        <svg
          t="1773990796815"

    </div>

    <!-- autocomplete="off"指不记录之前的输入内容 -->
    <form action="" class="form" autocomplete="off">
      <div class="shuru">
        <!-- tel在移动端是数字键盘 -->
        <input type="tel" placeholder="请输入手机号" />
      </div>

        </svg>
      </div>

      <div class="tongyi">
        <svg
          t="1773994719449"
          class="icon"
          viewBox="0 0 1024 1024"
          version="1.1"
          xmlns="http://www.w3.org/2000/svg"
          p-id="11765"
          xmlns:xlink="http://www.w3.org/1999/xlink"
        >
          <path
            d="M511.807488 45.056C252.893184 45.056 43.008 254.941184 43.008 513.855488c0 258.90816 209.885184 468.799488 468.799488 468.799488 258.90816 0 468.799488-209.891328 468.799488-468.799488C980.609024 254.941184 770.715648 45.056 511.807488 45.056L511.807488 45.056zM511.807488 929.792c-229.71392 0-415.936512-186.222592-415.936512-415.936512 0-229.71392 186.222592-415.936512 415.936512-415.936512S927.744 284.141568 927.744 513.855488C927.744 743.569408 741.521408 929.792 511.807488 929.792L511.807488 929.792zM511.807488 929.792"

            p-id="11766"
          ></path>
        </svg>
        我已同意 <a href="#">用户协议</a> 及 <a href="#">隐私协议</a>
      </div>

      <button>登录</button>
      <p class="forget"><a href="#">忘记密码 ？</a></p>
    </form>

    <!-- 第三方登录 -->
    <div class="third-login">
      <p>
        <span>第三方登录</span>
      </p>

      <a href="#">
