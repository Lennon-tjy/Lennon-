<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>

    <input type="text" />

    <script>
      // const btn = document.querySelector("button");
      // btn.addEventListener("click", function (e) { //e是事件对象，写其他的也可以，但一般写e
      //   console.log(e);

      //   //里面的type是当前事件类型

      //   //clientX和clientY是相对于浏览器窗口的左上角位置，,clientX：22 是距离上面22px，clientY：25 是距离左边25px

      //   //offsetX和offsetY是x相对于当前dom元素的左上角位置
      // });

      //key：用户按下的键盘的值
      const input = document.querySelector("input");
      input.addEventListener("keyup", function (e) {
        //e是事件对象，写其他的也可以，但一般写e
        // console.log(e.key); //通过key可以知道用户按下了哪个键
        if (e.key === "Enter") {
          console.log("你按下了Enter键");
        }
      });
    </script>
  </body>
