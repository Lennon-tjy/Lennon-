<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul>
      <li>第1个</li>
      <li>第2个</li>
      <li>第3个</li>
      <li>第4个</li>
      <li>第5个</li>
      <p>我不需要变颜色</p>
    </ul>

    <script>
      //需求：点击li，当前li的文字变为红色
      //使用事件委托，委托给了父级，事件写在父级身上
      const ul = document.querySelector("ul");
      ul.addEventListener("click", function (e) {
        // console.log(e.target); //获得点击的对象
        // e.target.style.color = "red"; //点击了p标签后，p也变色
        if (e.target.tagName === "LI") {
          e.target.style.color = "red";
        }
      });
    </script>
  </body>
</html>
