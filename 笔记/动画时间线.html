<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kennoily</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 3000px;
      }

      .scroll {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: linear-gradient(
          90deg,
          /*0deg是从下到上，90deg是从左到右，180deg是从上到下，270deg是从右到左*/
          #96f,
          #bf70ff,
          #e67aff,
          #ff89dc,
          #ffb90f
        );
        animation: scroll 2s linear;
        /* 滚动时间线 */
        animation-timeline: scroll();
      }

      @keyframes scroll {
        0% {
          width: 0%;
        }
        100% {
          width: 100%;
        }
      }

      .box {
        position: sticky;
        top: 50px;
        width: 1000px;
        height: 500px;
        margin: 800px auto 0; /*上 左右 下*/
        /* background-color: pink; */
      }

      .box p {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 30px;
      }

      .pic1 {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
      }

      .pic2 {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 300px;
      }

      .box img {
        opacity: 0.2;
        animation: move 2s linear forwards;
        /* 视图时间线 */
        animation-timeline: view();
      }

      @keyframes move {
        0% {
          transform: scale(1);
          opacity: 0.2;
        }
        100% {
          transform: scale(1.8);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="scroll"></div>

    <div class="box">
      <p>哈基米</p>
      <img
        src="https://ts2.tc.mm.bing.net/th/id/OIP-C.QSaRlqb514DphfyaYPBuhAHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
        alt=""
        class="pic1"
      />
      <img
        src="https://ts4.tc.mm.bing.net/th/id/OIP-C.kO3gidba1ihbhoZkBetF7gHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
        alt=""
        class="pic2"
      />
    </div>
  </body>
</html>
