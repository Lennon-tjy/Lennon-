<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="item" id="item1">1</div>
      <div class="item" id="item2">2</div>
      <div class="item" id="item3">3</div>
      <div class="item" id="item4">4</div>
      <div class="item" id="item5">5</div>
      <div class="item" id="item6">6</div>
      <div class="item" id="item7">7</div>
      <div class="item">8</div>
      <div class="item">9</div>
    </div>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        display: grid;
        border: 5px solid red;
        grid-template-columns: repeat(5, 150px);
        grid-template-rows: repeat(5, 150px);
      }

      .item {
        background-color: rgb(62, 186, 228);
        border: 1px solid rgb(46, 153, 189);
      }

      #item1 {
        grid-row: span 2;
        grid-column: span 2;
        background-color: black;
      }

      #item6 {
        grid-row: span 2;
        grid-column: span 2;
      }

      #item2 {
        grid-column: 3/5;
        grid-row: 1/4;
        background-color: rgb(6, 189, 6);
      }

      #item5 {
        grid-column: 3/4;
        grid-row: 1/2;
      }
    </style>
  </body>
</html>
