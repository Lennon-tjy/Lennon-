<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Kennoily</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #f0f7ff;
      }

      .box {
        position: relative;
        width: 1280px;
        height: 400px;
        margin: 200px auto;
        /* overflow: hidden; */
      }

      .box::before,
      .box::after {
        position: absolute;
        left: 0;
        content: "";
        width: 100%;
        height: 100px;
        background-color: #f0f7ff;
        border-radius: 50%;
        z-index: 1;
      }

      .box::before {
        content: "可爱的猫咪,滚动鼠标可以查看~";
        top: -50px;
        text-align: center;
        line-height: 70px;
        font-size: 30px;
        color: #333;
      }

      .box::after {
        bottom: -50px;
      }

      .box ul {
        display: flex;
        gap: 8px;
        list-style: none;
        height: 100%;
        /*添加水平滚动条*/
        overflow-x: scroll;
        overflow-y: hidden;
        scrollbar-width: none; /*不显示滚动条*/
        scroll-behavior: smooth; /*平滑滚动*/
      }

      /* 不显示滚动条，适配谷歌或苹果浏览器 */
      .box ul::-webkit-scrollbar {
        display: none;
      }

      .box ul li {
        flex: 0 0 400px; /*不拉伸，不伸缩，初始值为200px*/
        height: 400px;
        background-color: pink;
      }

      .box ul li img {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

    <script>
      //获取可滚动容器
      const scrollContainer = document.querySelector(".box ul");

      //监听滚轮事件
      scrollContainer.addEventListener("wheel", (e) => {
        //阻止默认滚动行为
        e.preventDefault();

        //乘系数可调整滚动灵敏度
        scrollContainer.scrollLeft += e.deltaY * 2.0;
      });
    </script>
