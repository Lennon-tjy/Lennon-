    <meta charset="UTF-8" />

    <title>Kennoily</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #000;
        overflow: hidden;
      }

      .svg1,
      .svg2,
      .svg3 {
        display: block;
        /* 通过宽高修改大小 */
        width: 200px;
        height: 200px;
        margin: 50px auto;
      }

      .svg1 {
        fill: #f4ea2a; /* 通过fill修改颜色,需要先删除svg那里自带的fill */
        stroke: #fff; /*描边颜色*/
        stroke-width: 10px;
        stroke-dasharray: 30 30; /*虚线模式，第一个值表示实线长度，第二个值表示空白的长度  这里可简写成stroke-dasharray: 30;*/
      }

      .svg1:hover {
        animation: move1 0.5s linear;
      }

      @keyframes move1 {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
        100% {
          transform: translateY(0);
        }
      }

      .svg2 {
        fill: none;
        stroke: #fff;
        stroke-width: 5px;
      }

      .svg2:hover {
        animation: move2 0.6s linear;
      }

      @keyframes move2 {
        0% {
          stroke-dasharray: 0 400;
        }
        100% {
          stroke-dasharray: 400 0;
        }
      }

      .svg3 {
        fill: none;
        stroke: red;
        stroke-width: 10px;
        stroke-dasharray: 2726; /* 2726是总长，相当于没有虚线 */
        stroke-dashoffset: 2726; /*stroke-dashoffset是距离起始点的偏移量*/
        animation: move3 2s linear infinite;
      }

      @keyframes move3 {
        /*从无到有的过程*/
        0% {
          stroke-dashoffset: 2726;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
