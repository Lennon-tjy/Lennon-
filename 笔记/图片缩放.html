<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kennoily</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .boxx {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        grid-auto-flow: column;
        max-width: 1760px;
        height: 900px;
        margin: 100px auto;
        gap: 20px;
        border-radius: 20px;
        overflow: hidden; /*剪切图片，显示圆角*/
      }

      .box {
        background-color: pink;
      }

      .boxx .box:nth-child(1) {
        grid-row: 1 / 3;
      }

      .boxx .box:nth-child(3) {
        grid-column: 2 / 4;
        grid-row: 2 / 3;
      }

      .box img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover; /*图片等比例缩放，填充容器*/
        object-position: center; /*控制图片在容器内对齐位置*/
      }
    </style>
  </head>
  <body>
    <div class="boxx">
      <div class="box">
        <img src="../img/登高1.png" alt="" />
      </div>
      <div class="box">
        <img src="../img/山水湖色.jpg" alt="" />
      </div>
      <div class="box">
        <img src="../img/白雪蓝天.jpg" alt="" />
      </div>
      <div class="box">
        <img src="../img/广阔蓝海.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
