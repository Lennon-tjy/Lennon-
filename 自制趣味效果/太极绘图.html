<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: pink;
      }

      .taiji {
        position: relative;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: linear-gradient(to right, #fff 50%, #000 50%);
        margin: 200px auto;
      }

      .taiji::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        height: 50%;
        border-radius: 50%;
        background-color: #000;
      }

      .taiji::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        height: 50%;
        border-radius: 50%;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="taiji"></div>
  </body>
</html>
