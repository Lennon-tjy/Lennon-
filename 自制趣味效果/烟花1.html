<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>你好,2026</title>
  </head>

  <body>
    <div class="container">
      <div class="text">新年快乐~</div>
    </div>
    <canvas id="canvas1"></canvas>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Comic Sans MS", cursive, sans-serif;
      }

      body {
        overflow: hidden;
        background-color: #000;
        position: relative;
      }

      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        background: transparent;
      }

      .container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      .text {
        position: absolute;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 4vw;
        font-weight: bold;
        white-space: nowrap;
        background: linear-gradient(
          97deg,
          #f15050,
          #ff87a8,
          #bb64fb,
          #7a8cff,
          #0096ff
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: change 3s linear infinite;
      }

      @keyframes change {
        0% {
          background-position: 0% 0%;
        }
        100% {
          background-position: 200% 0%;
        }
      }

      @media (max-width: 375px) {
        .text {
          font-size: 40px;
          top: 3%;
        }
      }
    </style>

    <script>
      const canvas = document.getElementById("canvas1");
      const ctx = canvas.getContext("2d");

      // 适配窗口
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const random = (min, max) => Math.random() * (max - min) + min;

      const fireworkColors = [
        "#ff0000", //深红
        "#ff4d4d",
        "#ff6b6b", // 浅红
        "#ffd700",
        "#ffed00",
        "#f9f293", // 金
        "#ff69b4",
        "#ff87ce",
        "#ff99cc", // 粉
      ];

      const rocketColor = "#ffd700"; // 上升烟花的颜色（金色）

      // 爆炸后的碎片
      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.speed = random(5, 8);
          this.angle = random(0, Math.PI * 2);
          this.gravity = 0.08;
          this.vx = Math.cos(this.angle) * this.speed;
          this.vy = Math.sin(this.angle) * this.speed;
          this.color =
            fireworkColors[Math.floor(random(0, fireworkColors.length))];
          this.alpha = 1;
          this.decay = random(0.005, 0.01); // 消失稍慢，提升视觉效果
          this.size = random(1.5, 3.5);
        }

        update() {
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= this.decay;
          this.vx *= 0.98;
          this.vy *= 0.98;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          ctx.restore();
        }
      }

      // 上升阶段
      class FireworkRocket {
        constructor() {
          // 从底部随机位置发射
          this.x = random(canvas.width * 0.1, canvas.width * 0.9);
          this.y = canvas.height; // 初始位置在页面底部
          this.speed = random(8, 12); // 上升速度
          this.alpha = 1;
          this.targetY = random(canvas.height * 0.2, canvas.height * 0.6); // 爆炸高度
          this.size = 2;
        }

        // 上升更新
        update() {
          this.y -= this.speed; // 向上移动（y轴递减）
          // 上升过程中逐渐减速
          this.speed *= 0.99;
          // 到达目标高度则爆炸
          return this.y <= this.targetY;
        }

        // 绘制上升的烟花
        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = rocketColor;
          ctx.fill();
          // 尾部拖影
          ctx.beginPath();
          ctx.arc(this.x, this.y + 10, this.size / 2, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,215,0,0.5)";
          ctx.fill();
          ctx.restore();
        }
      }

      // 存储待上升的烟花和炸开的粒子
      let rockets = [];
      let particles = [];

      // 数量控制配置
      const maxRockets = 10; // 同时存在的最大烟花数量
      const maxInterval = 50; // 最小发射间隔
      const maxParticleNum = 300; // 最大粒子数
      // 初始配置
      let fireworkCount = 0;
      let baseInterval = 300;
      let baseParticleNum = 250;

      // 创建烟花（上升阶段）
      function createFireworkRocket() {
        // 只有当前烟花数量 < 最大值时，才创建新烟花
        if (rockets.length >= maxRockets) return;

        // 计数器递增，但粒子数/间隔达到上限后不再变化
        fireworkCount++;
        if (fireworkCount % 10 === 0) {
          // 间隔只减到最小值为止
          baseInterval = Math.max(maxInterval, baseInterval - 20);
          // 粒子数只增到最大值为止
          baseParticleNum = Math.min(maxParticleNum, baseParticleNum + 20);
        }

        rockets.push(new FireworkRocket());
        // 重新设置定时器（间隔不会无限变小）
        clearInterval(launchTimer);
        launchTimer = setInterval(createFireworkRocket, baseInterval);
      }

      // 爆炸生成粒子
      function explodeFirework(x, y) {
        const particleCount = random(baseParticleNum, baseParticleNum + 50);
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle(x, y));
        }
      }

      // 动画循环
      function animate() {
        requestAnimationFrame(animate);
        // 半透明背景，保留拖影
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 更新并绘制烟花
        for (let i = rockets.length - 1; i >= 0; i--) {
          const rocket = rockets[i];
          const isExploded = rocket.update();
          rocket.draw();

          // 到达目标高度，爆炸并移除烟花
          if (isExploded) {
            explodeFirework(rocket.x, rocket.y);
            rockets.splice(i, 1);
          }
        }

        // 更新并绘制粒子
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw();
          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      // 启动发射定时器
      let launchTimer = setInterval(createFireworkRocket, baseInterval);
      // 初始立即发射一个，避免空白
      createFireworkRocket();
      // 启动动画
      animate();
    </script>
  </body>
</html>
