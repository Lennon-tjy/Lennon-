<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lennon</title>
  </head>

  <body>
    <div class="name">Lennon自制风扇</div>
    <div class="container">
      <div class="fan">
        <div class="head">
          <div class="head-inner"></div>
          <div class="blades">
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="logo"></div>
          </div>
        </div>
        <div class="rack"></div>
        <div class="base">
          <div class="btn1">开关</div>
          <div class="btn2">摇头</div>
          <div class="btn3">加速</div>
          <div class="btn4">再加速</div>
        </div>
      </div>
    </div>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Comic Sans MS", cursive, sans-serif;
      }

      body {
        width: 100vw;
        height: 100vh;
        background-color: #1a252c;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: fixed;
        overflow: hidden;
      }

      .name {
        font-size: 30px;
        font-weight: bold;
        color: blueviolet;
        margin-bottom: 50px;
      }

      .container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .fan {
        position: relative;
        display: flex;
        align-items: center;
        flex-direction: column;
      }

      .head {
        position: relative;
        width: 360px;
        height: 360px;
        border: 20px solid transparent;
        border-radius: 50%;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(
              110deg,
              red,
              orange,
              yellow,
              rgb(99, 236, 99),
              rgb(102, 102, 238),
              rgb(185, 112, 237),
              violet
            )
            border-box;
        background-color: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-style: preserve-3d;
        z-index: 3;
        background-size: 50% 50%;
        animation: borderFlow 20s linear infinite;
        will-change: transform, background-position;
      }

      .head.shake {
        animation:
          borderFlow 20s linear infinite,
          yaotou 10s ease-in-out infinite alternate;
      }

      @keyframes borderFlow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes yaotou {
        0%,
        100% {
          transform: rotateY(40deg);
        }
        50% {
          transform: rotateY(-40deg);
        }
      }

      .head-inner {
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2;
      }

      .head::before {
        content: "";
        position: absolute;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 3px solid rgb(239, 118, 239);
        border-radius: 50%;
        transform: scale(0.85);
      }

      .head::after {
        content: "";
        position: absolute;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 3px solid cyan;
        border-radius: 50%;
        transform: scale(0.7);
      }

      .blades {
        position: absolute;
        width: 280px;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .blade {
        position: absolute;
        width: 53%;
        height: 20%;
        border-radius: 50%;
        box-shadow: inset -4px -8px 3px 2px rgba(0, 0, 0, 0.05);
        background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      }

      .blade:nth-child(1) {
        transform: rotate(0deg) translateX(60px);
      }
      .blade:nth-child(2) {
        transform: rotate(120deg) translateX(60px);
      }
      .blade:nth-child(3) {
        transform: rotate(240deg) translateX(60px);
      }

      .logo {
        width: 55px;
        height: 55px;
        background-color: #e74c3c;
        border: 8px solid #f5f5f5;
        border-radius: 50%;
        z-index: 1;
        box-shadow: 0 0 30px 20px rgba(231, 76, 60, 0.5);
      }

      .rack {
        width: 25px;
        height: 200px;
        margin-top: -20px;
        background: linear-gradient(90deg, #95a5a6, #7f8c8d);
      }

      .base {
        position: absolute;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        width: 320px;
        height: 80px;
        margin-top: 500px;
        background: linear-gradient(135deg, #506579, #405366);
        border-radius: 40px;
        box-shadow: 0 10px 20px rgba(134, 114, 114, 0.2);
        border: 8px solid #aacaed;
      }

      .base > div {
        width: 50px;
        height: 30px;
        background-color: #ecf0f1;
        border-radius: 50%;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #333;
        font-weight: bold;
        font-size: 16px;
      }

      .base > div:active {
        transform: scale(0.9);
      }

      .btn1.active {
        background-color: #2ecc71;
        box-shadow: 0 0 15px #2ecc71;
      }
      .btn2.active {
        background-color: #3498db;
        box-shadow: 0 0 15px #3498db;
      }
      .btn3.active {
        background-color: #f39c12;
        box-shadow: 0 0 8px #f39c12;
      }
      .btn4.active {
        background-color: #9b59b6;
        box-shadow: 0 0 8px #9b59b6;
      }

      @media (max-width: 480px) {
        .head {
          width: 280px;
          height: 280px;
        }
        .head-inner,
        .blades {
          width: 220px;
          height: 220px;
        }
        .base {
          width: 280px;
          margin-top: 400px;
        }
      }
    </style>

    <script>
      const blades = document.querySelector(".blades");
      const head = document.querySelector(".head");
      const btn1 = document.querySelector(".btn1");
      const btn2 = document.querySelector(".btn2");
      const btn3 = document.querySelector(".btn3");
      const btn4 = document.querySelector(".btn4");

      let isRotating = false;
      let rotationAngle = 0;
      let rotationSpeed = 5;
      let animationId = null;

      function rotateBlades() {
        rotationAngle += rotationSpeed;
        blades.style.transform = `rotate(${rotationAngle}deg)`;
        animationId = requestAnimationFrame(rotateBlades);
      }

      btn1.addEventListener("click", () => {
        if (isRotating) {
          btn3.classList.remove("active");
          btn4.classList.remove("active");

          const slowDown = () => {
            rotationSpeed *= 0.95;
            if (rotationSpeed > 0.1) {
              requestAnimationFrame(slowDown);
            } else {
              cancelAnimationFrame(animationId);
              isRotating = false;
              head.classList.remove("shake");
              btn2.classList.remove("active");
            }
          };
          slowDown();
        } else {
          isRotating = true;
          rotationSpeed = 10;
          rotateBlades();
        }
        btn1.classList.toggle("active");
      });

      btn2.addEventListener("click", () => {
        if (isRotating) {
          head.classList.toggle("shake");
          btn2.classList.toggle("active");
        }
      });

      btn3.addEventListener("click", () => {
        if (isRotating) {
          rotationSpeed = 20;
          btn3.classList.add("active");
          btn4.classList.remove("active");
        }
      });

      btn4.addEventListener("click", () => {
        if (isRotating) {
          rotationSpeed = 30;
          btn4.classList.add("active");
          btn3.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
