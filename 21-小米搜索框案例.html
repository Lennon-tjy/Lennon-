<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        /* background-color: #000; */
        font-family: "微软雅黑";
      }

      ul {
        list-style: none;
      }

      .mi {
        position: relative;
        width: 300px;
        height: 300px;
        margin: 100px auto;
        font-size: 18px;
        /* box-shadow: 0 0 10px #000; */
      }

      .active {
        border: 1px solid #ff6700;
      }

      .mi .search input {
        width: 300px;
        height: 50px;
        padding: 0 10px;
        line-height: 50px;
        font-size: 18px;
        /* border-radius: 25px; */
        outline: none;
      }

      .mi .search input::placeholder {
        color: #999;
        font-size: 18px;
      }

      .mi-list {
        display: none;
        position: absolute;
        top: 50px;
        left: 0;
        width: 300px;
        line-height: 50px;
        padding-left: 12px;
        border: 1px solid #ff6700;
        border-top: none;
      }

      .mi-list li a {
        text-decoration: none;
        color: #000;
      }
    </style>
  </head>

  <body>
    <div class="mi">
      <div class="search">
        <input type="search" placeholder="小米笔记本" />
      </div>
      <ul class="mi-list">
        <li><a href="#">小米11</a></li>
        <li><a href="#">小米10S</a></li>
        <li><a href="#">小米笔记本</a></li>
        <li><a href="#">小米Air 13</a></li>
        <li><a href="#">小米11 Pro</a></li>
      </ul>
    </div>

    <script>
      const search = document.querySelector(".search input");
      const miList = document.querySelector(".mi-list");

      search.addEventListener("focus", function () {
        miList.style.display = "block";
        search.classList.add("active");
      });

      search.addEventListener("blur", function () {
        miList.style.display = "none";
        search.classList.remove("active");
      });
    </script>
  </body>
</html>
