<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //随机生成1-10之间的整数
      function getRandom(N = 0, M = 0) {
        return Math.floor(Math.random() * (M - N + 1) + N);
      }
      let random = getRandom(1, 10);
      //用户输入
      alert("欢迎参加猜数字游戏!");
      while (1) {
        let num = +prompt("请输入1-10之间的整数");
        //判断
        if (num === random) {
          alert("恭喜你猜对了!");
          break;
        } else if (num > random) {
          alert("猜大了");
        } else {
          alert("猜小了");
        }
      }
    </script>
  </body>
</html>
