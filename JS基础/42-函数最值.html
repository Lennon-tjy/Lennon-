    <script>
      //求两个数之间的最大值
      // function getMax(x, y) {
      //   return x > y ? x : y;
      // }
      // let Max = getMax(1, 2);
      // console.log(Max);

      //2.求任意数组的最大值
      function getArrMax(arr = []) {
        let max = arr[0];
        let min = arr[0];
        for (let i = 1; i < arr.length; i++) {
          if (max < arr[i]) {
            max = arr[i];
          }
          if (min > arr[i]) {
            min = arr[i];
          }
        }
        return [max, min];
      }

      // let result = getArrMax((arr = [(1, 5, 88, 23, 100)]));//错误
      let result = getArrMax([1, 5, 88, 23, 100]);

      console.log(`数组最大值是${result[0]}`);
      console.log(`数组最小值是${result[1]}`);
    </script>
