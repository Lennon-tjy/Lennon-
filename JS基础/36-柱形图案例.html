<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .box {
        width: 700px;
        height: 400px;
        display: flex;
        justify-content: space-evenly;
        align-items: end;
        border-left: 2px solid pink;
        border-bottom: 2px solid pink;
        margin: 50px auto;
        text-align: center;
      }

      .box > div {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 50px;
        background-color: pink;
      }

      .box div span {
        margin-top: -25px;
      }

      .box div h4 {
        margin-bottom: -35px;
        width: 70px;
        margin-left: -10px;
      }
    </style>
  </head>

  <body>
    <!-- <div class="box">
      <div style="height: 123px">
        <span>123</span>
        <h4>第1季度</h4>
      </div>

      <div style="height: 156px">
        <span>156</span>
        <h4>第2季度</h4>
      </div>

      <div style="height: 120px">
        <span>120</span>
        <h4>第3季度</h4>
      </div>

      <div style="height: 210px">
        <span>210</span>
        <h4>第4季度</h4>
      </div>
    </div> -->

    <script>
      let arr = [];
      for (let i = 1; i <= 4; i++) {
        arr.push(prompt(`请输入第${i}季度的销售额`));
      }

      //box的开头
      document.write(`<div class="box">`);

      //box中间部分
      for (let i = 0; i < arr.length; i++) {
        document.write(`<div style="height: ${arr[i]}px">
        <span>${arr[i]}</span>
        <h4>第${i + 1}季度</h4>
      </div>`);
      }

      //box的结尾
      document.write(`</div>`);
    </script>
  </body>
</html>
