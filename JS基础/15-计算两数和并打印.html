<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num1 = +prompt("请输入第一个数字");
      alert(`第一个数是${num1}`);
      let num2 = +prompt("请输入第二个数字");
      alert(`第二个数是${num2}`);
      let sum = num1 + num2;
      alert(`两个数的和是${sum}`);

      document.write(`${num1}+${num2}=${sum}`);
    </script>
  </body>
</html>
