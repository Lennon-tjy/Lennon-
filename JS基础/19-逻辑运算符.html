<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lennon</title>
  </head>

  <body>
    <script>
      // 与
      console.log(true && false); // 一假则假

      // 或
      console.log(true || false); // 一真则真

      // 非
      console.log(!true);
    </script>
  </body>
</html>
