<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //生成1-10之间的随机数
      function getRandom(N, M) {
        return Math.floor(Math.random() * (M - N + 1) + N);
      }
      let random = getRandom(1, 10);

      alert("欢迎参加猜数字游戏，你只有3次机会");

      let flag = true; //开关变量
      for (let i = 1; i <= 3; i++) {
        let num = +prompt("请输入1-10之间的整数");
        if (num > random) {
          alert("猜大了");
        } else if (num < random) {
          alert("猜小了");
        } else {
          flag = false;
          alert("恭喜你猜对了");
          break;
        }
      }
      if (flag === true) {
        alert("次数用完了");
      }
    </script>
  </body>
</html>
