<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lennon</title>
  </head>

  <body>
    <script>
      console.log(3 > 5);
      // 双等号只判断值
      console.log(2 == "2"); //比较运算符有隐式转换
      console.log(2 === "2"); //全等号判断值和类型
      console.log("--------------");
      console.log(2 != "2");
      console.log(2 !== "2"); //不全等
      console.log("--------------");
      console.log(NaN == NaN);
      console.log(NaN === NaN);
    </script>
  </body>
</html>
