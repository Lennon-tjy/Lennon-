<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //数组对象
      let students = [
        { name: "小明", age: 19, gender: "男", hometown: "北京" },
        { name: "小红", age: 18, gender: "女", hometown: "上海" },
        { name: "小刚", age: 18, gender: "男", hometown: "广州" },
        { name: "小丽", age: 17, gender: "女", hometown: "深圳" },
      ];

      for (let i = 0; i < students.length; i++) {
        //console.log(i);//下标索引
        console.log(students[i]);
        console.log(students[i].name);
      }
    </script>
  </body>
