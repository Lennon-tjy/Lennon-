<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h2 {
        text-align: center;
      }

      table {
        width: 600px;
        text-align: center;
        margin: 0 auto;
      }

      table,
      th,
      td {
        border: 1px solid #ccc;
        border-collapse: collapse;
      }

      tr {
        height: 40px;
        cursor: pointer;
      }

      table tr:nth-child(1) {
        background-color: #ddd;
      }

      table tr:not(:first-child):hover {
        background-color: #eee;
      }
    </style>
  </head>

  <body>
    <h2>学生信息表</h2>
    <table>
      <tr>
        <th>序号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>家乡</th>
      </tr>

      <script>
        //数组对象
        let students = [
          { name: "小明", age: 19, gender: "男", hometown: "北京" },
          { name: "小红", age: 18, gender: "女", hometown: "上海" },
          { name: "小刚", age: 18, gender: "男", hometown: "广州" },
          { name: "小丽", age: 17, gender: "女", hometown: "深圳" },
          // { name: "小绿", age: 18, gender: "女", hometown: "武汉" },
        ];

        for (let i = 0; i < students.length; i++) {
          document.write(`
      <tr>
        <td>${i + 1}</td>
        <td>${students[i].name}</td>
        <td>${students[i].age}</td>
        <td>${students[i].gender}</td>
        <td>${students[i].hometown}</td>
      </tr>
        `);
        }
      </script>
    </table>
  </body>
</html>
