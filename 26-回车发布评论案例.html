<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .box {
        text-align: center;
        margin-top: 100px;
      }

      .box input {
        width: 500px;
        height: 50px;
        background-color: #f5f5f5;
        font-size: 16px;
        padding-left: 10px;
        border-radius: 5px;
        border: none;
        outline: none;
        transition: all 0.3s ease-in-out;
        vertical-align: bottom;
      }

      .box input:focus {
        width: 600px;
        height: 70px;
      }

      .box input:focus + button {
        width: 100px;
        height: 70px;
        font-size: 20px;
      }

      .box button {
        width: 70px;
        height: 50px;
        font-size: 16px;
        background-color: skyblue;
        color: #fff;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
      }

      .calculate {
        font-size: 14px;
        color: #999;
        margin-top: 10px;
        opacity: 0;
      }

      .banxin {
        width: 580px;
        margin: 20px auto;
      }

      .list {
        height: 100px;
      }

      .list .item {
        /* width: 100%; */
        display: none;
        gap: 10px;
      }

      .list .item .info {
        border-bottom: 1px dashed #e4e4e4;
        padding-bottom: 10px;
      }

      .info .name {
        color: #fb7299;
        font-size: 14px;
        font-weight: bold;
      }

      .info .comment {
        color: #333;
        padding: 10px 0;
      }

      .info .time {
        color: #999;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <input
        type="text"
        placeholder="发一条友善的评论吧"
        rows="2"
        maxlength="200"
      />
      <button>发布</button>
      <div class="calculate">0 / 200 字</div>
    </div>

    <div class="list banxin">
      <div class="item">

        <div class="info">
          <div class="name">哈哈哈</div>
          <div class="comment">
            大家辛苦啦，感谢各位大大的努力，能圆满完成真是太好了！
          </div>
          <div class="time">2026-04-07 20:02:31</div>
        </div>
      </div>
    </div>

    <script>
      //获得焦点，显示text
      const input = document.querySelector("input");
      const calculate = document.querySelector(".calculate");

      input.addEventListener("focus", function () {
        calculate.style.opacity = 1;
      });

      //失去焦点，隐藏text
      input.addEventListener("blur", function () {
        calculate.style.opacity = 0;
      });

      //用户输入，更新text
      input.addEventListener("input", function () {
        calculate.innerHTML = `${input.value.length} / 200 字`;

        if (input.value.length > 200) {
          calculate.innerHTML = "最多输入200个字";
          //禁止输入
          input.value = input.value.slice(0, 200);
        }
      });

      //按下回车，发布评论
      const item = document.querySelector(".item");
      const comment = document.querySelector(".comment");

      input.addEventListener("keyup", function (e) {
        if (e.key === "Enter") {
          //判断是否输入为空
          if (input.value.trim() !== "") {
            item.style.display = "flex";
            comment.innerHTML = input.value;
          }
          //按下回车后清空输入框
          input.value = "";
          //按下回车后复原calculate
          calculate.innerHTML = "0 / 200 字";
        }
      });
    </script>
  </body>
</html>
