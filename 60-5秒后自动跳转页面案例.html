<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      a {
        font-size: 20px;
      }

      a span {
        color: red;
      }
    </style>
  </head>
  <body>
    <a href="https://www.baidu.com"
      >注册成功，<span>5</span>秒钟之后跳转到百度</a
    >

    <script>
      //获取
      const a = document.querySelector("a");
      //开启定时器
      //倒计时变量
      let i = 5;
      let timer = setInterval(function () {
        i--;
        a.innerHTML = `注册成功，<span>${i}</span>秒钟之后跳转到百度`;

        //倒计时结束停止定时器并完成跳转
        if (i === 0) {
          clearInterval(timer);
          //跳转
          location.href = a.href;
        }
      }, 1000);
    </script>
  </body>
</html>
