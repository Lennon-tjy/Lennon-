<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        background-color: pink;
        color: red;
      }

      .boxx {
        width: 300px;
        height: 300px;
        background-color: skyblue;
        margin: 100px auto;
      }
    </style>
  </head>
  <body>
    <div class="box">123</div>

    <script>
      const box = document.querySelector(".box");
      //通过更换类名修改样式
      box.className = "boxx";
      //box.className = "box boxx"; //相当于两个类名样式一起用
    </script>
  </body>
</html>
