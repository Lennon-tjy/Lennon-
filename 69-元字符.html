<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //元字符是正则表达式里的特殊功能符号，它不代表它自己，而是代表一类字符

      //元字符中的边界符
      //^ 表示以什么开头
      //$ 表示以什么结尾

      console.log(/哈/.test("哈")); //true

      //边界符
      console.log(/^哈/.test("嘻哈")); //false

      console.log(/哈$/.test("哈喽")); //false

      console.log(/^哈$/.test("哈哈")); //false，这种精确匹配意味着只能有一个哈

      console.log("^$----------------------");

      //量词
      // * 表示0个或多个
      console.log(/^哈*$/.test("哈哈")); //true
      console.log("*----------------------");

      // + 表示1个或多个
      console.log(/^哈+$/.test("哈哈")); //true
      console.log("+----------------------");

      // ? 表示0个或1个
      console.log(/^哈?$/.test("哈")); //true
      console.log(/^哈?$/.test("")); //true
      console.log("?----------------------");

      //{n}，表示重复n次
      console.log(/^哈{3}$/.test("哈哈哈")); //true，只有哈重复3次才true
      console.log("{n}----------------------");

      //{n,} ，表示重复n次或更多
      console.log(/^哈{3,}$/.test("哈哈哈哈")); //true，哈重复3次或更多次才true
      console.log("{n,}----------------------");

      //{n,m} ，表示重复n次到m次，逗号两侧不能有空格
      console.log(/^哈{3,5}$/.test("哈哈哈哈哈")); //true，哈重复3次到5次才true
      console.log("{n,m}----------------------");

      //字符类
      //^[abc]$ 表示只能在a，b，c中选择一个
      console.log(/^[abc]$/.test("a"));
      //没有边界符则只要包含a，b，c中的任意一个即可
      console.log(/[abc]/.test("aef"));

      //[a-z]，表示a到z中的任意一个
      console.log(/^[a-z]$/.test("z"));
      console.log(/^[A-Z]$/.test("A"));
      console.log(/^[0-9]$/.test("8"));

      //[a-zA-Z0-9]，表示a到z，A到Z，0到9中的任意一个
      console.log(/^[a-zA-Z0-9]$/.test("6"));

      //[^a-z]，表示除了a到z中的任意一个
      console.log(/^[^a-z]$/.test("A"));

      console.log("^[]$----------------------");

      //预定义：指常见模式的简写方式
      // \d 相当于[0-9]
      // \D 相当于[^\0-9]
      // \w 相当于[a-zA-Z0-9_]
      // \W 相当于[^\a-zA-Z0-9_]
      // \s 相当于[ \t\n\n\r]
      // \S 相当于[^\ \t\n\n\r]

      console.log("----------------------");

      //腾讯QQ号从10000号开始
      //^[1-9][0-9]{4,}$

      //日期格式
      //^\d{4}-\d{1,2}-\d{1,2}$
    </script>
  </body>
</html>
