<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kennoily</title>
    <style>
      body {
        background-color: #f0f7ff;
      }

      .card {
        position: relative;
        width: 280px;
        height: 320px;
        margin: 200px auto;
      }

      .card div {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 0px 30px 40px 40px;
        transform-origin: left top; /*设置倾斜中心点*/
        transition: all 0.3s;
      }

      .front {
        background-color: rgba(255, 255, 255, 0.4);
        z-index: 1;
        backdrop-filter: blur(30px);
      }

      .back {
        background-color: purple;
        transform: skewY(8deg);
      }

      .card:hover .back {
        transform: skewY(15deg);
        width: 240px;
      }

      .card:hover .front {
        transform: translateY(-3px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="front"></div>
      <div class="back"></div>
    </div>
  </body>
</html>
