<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kennoily</title>

    <style>
      body {
        background-color: #f0f7ff;
        perspective: 500px; /*值越小越明显*/
      }

      img {
        display: block;
        width: 400px;
        margin: 100px auto;
      }

      .imgx {
        transform: rotateX(-90deg);
      }

      .box {
        position: relative;
        width: 400px;
        height: 309px;
        margin: 60px auto;
      }

      .imgy,
      .back {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        backface-visibility: hidden; /*控制元素背面可见性*/
        transition: all 3s;
        transform-style: preserve-3d; /*给子元素开启3D空间，必须给亲爸爸加*/
      }

      .imgy {
        background: url(../img/B站1.jpg) no-repeat center center / cover;
      }

      .back {
        transform: rotateY(180deg);
        background: url(../img/B站2.webp) no-repeat center center / cover;
      }

      .imgy h3,
      .back h3 {
        text-align: center;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 2px;
        color: red;
        line-height: 50px;
        transform: translateZ(900px); /*写成translate3d(0,0,900px)会更好*/
        backface-visibility: hidden;
      }

      .box:hover .imgy {
        transform: rotateY(-180deg);
      }

      .box:hover .back {
        transform: rotateY(0deg);
      }

      .imgz {
        transform: rotateZ(20deg);
        transform-origin: left top;
      }
    </style>
  </head>
  <body>
    <img src="../img/京东热卖.png" alt="" class="imgx" />

    <div class="box">
      <div class="imgy">
        <h3>今天是2026年3月14日</h3>
      </div>
      <div class="back">
        <h3>明天会更好~</h3>
      </div>
    </div>

    <img src="../img/小兔鲜儿.png" alt="" class="imgz" />
  </body>
</html>
