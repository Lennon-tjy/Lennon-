      //两者有公共部分，继续抽取
      // const Person = {

      //为了解决给Woman添加属性后，Man也添加了属性的问题，要通过构造函数来实现（因为它们对象不同但内容相同）
      function Person() {
        this.headd = 1;
        this.eyes = 2;
      }

      function Woman() {}

      //Woman通过原型对象继承，这种方式叫原型继承
      Woman.prototype = new Person();
      //继承后把原先的constructor属性给覆盖了，所以要指回原来的构造函数
      Woman.prototype.constructor = Woman; //指回原来的构造函数

      Woman.prototype.sex = "女"; //添加一个属性，Man的属性也一起变了

      //因为Man和Woman都继承了同一个对象，指向同一个对象，所以修改一个，其实修改的是Person对象

      console.log(Woman.prototype);

      const woman = new Woman();
      console.log(woman);

      //

      function Man() {}
      Man.prototype = new Person();
      Man.prototype.constructor = Man;

      const man = new Man();
      console.log(man);
    </script>
