<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const user = {
        name: "lennon",
        walk: () => {
          console.log(this); //window，因为箭头函数没有自己的this，会指向上一级的作用域，而对象没有this，所以指向window
        },
      };
      user.walk();
    </script>
  </body>
