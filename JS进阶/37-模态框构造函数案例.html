<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .modal {
        width: 300px;
        height: 200px;
        margin: 200px auto;
        background-color: pink;
        padding: 10px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        height: fit-content;
      }

      .header i {
        width: 20px;
        height: 20px;
        /* background-color: #fff; */
        text-align: center;
        line-height: 20px;
        cursor: pointer;
      }

      .body {
        text-align: center;
        line-height: 150px;
      }
    </style>
  </head>

  <body>
    <button id="delete">删除</button>
    <button id="login">登录</button>

    <!-- <div class="modal">
      <div class="header">
        温馨提示
        <i>x</i>
      </div>
      <div class="body">您没有删除权限</div>
    </div> -->

    <script>
      //这个案例采用面向对象的封装思想
      //1.构造封装函数-模态框
      function Modal(title = "", message = "") {
        //创建模态框盒子
        this.modalBox = document.createElement("div");
        //添加类名modal
        this.modalBox.className = "modal";
        //给modalBox添加header和body
        this.modalBox.innerHTML = `
        <div class="header">
          ${title}
          <i>x</i>
        </div>
        <div class="body">${message}</div>
        `;

        console.log(this.modalBox);
      }
      // new Modal("温馨提示", "您没有删除权限");
      // new Modal("友情提示", "您还没有注册账号");

      //2.给构造函数原型对象挂载open方法
      Modal.prototype.open = function () {
        //先判断是否有modalBox，如果有，先删除，否则就继续添加
        const box = document.querySelector(".modal");

        // box && box.remove();
        if (box) {
          box.remove();
        }
        //把刚刚创建的modalBox显示到页面body中
        document.body.append(this.modalBox);

        //绑定点击关闭事件
        //在这个地方写是因为要等盒子显示出来才能绑定
        this.modalBox.querySelector("i").addEventListener("click", () => {
          //要使用箭头函数，因为普通函数没有this，这个this指向实例对象
          this.close();
        });
      };

      //3.给构造函数原型对象挂载close方法
      Modal.prototype.close = function () {
        this.modalBox.remove();
      };

      document.querySelector("#delete").addEventListener("click", () => {
        //先调用Modal
        const del = new Modal("温馨提示", "您没有删除权限");
        //实例对象调用open
        del.open();
      });

      document.querySelector("#login").addEventListener("click", () => {
        //先调用Modal
        const login = new Modal("友情提示", "您还没有注册账号");
        //实例对象调用open
        login.open();
      });
    </script>
  </body>
</html>
