<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //常用于求和
      //arr.reduce(function(上一次的值，当前值){},初始值)
      const arr = [1, 5, 8];
      //1.没有初始值的情况
      // const sum = arr.reduce(function (prev, current) {
      //   return prev + current;
      // });
      // console.log(sum); //14

      //原理
      //上一次的值  当前值  返回值
      //    1        5       6   （第一次循环）
      //    6        8       14  （第二次循环）

      //2.有初始值的情况
      const sum = arr.reduce(function (prev, current) {
        return prev + current;
      }, 10);
      console.log(sum); //24

      //原理
      //上一次的值  当前值  返回值
      //    10       1      11  （第一次循环）
      //    11       5      16  （第二次循环）
      //    16       8      24  （第三次循环）

      //箭头函数写法
      const sum1 = arr.reduce((prev, current) => prev + current, 10);
      console.log(sum1); //24
    </script>
  </body>
</html>
