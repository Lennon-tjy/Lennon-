<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
    </ul>

    <script>
      const lis = document.querySelectorAll("li");
      console.log(lis); //伪数组
      // lis.pop(); //报错

      //将伪数组转换为真数组
      const liss = Array.from(lis);
      console.log(liss); //真数组
      liss.pop();
      console.log(liss);
    </script>
  </body>
</html>
