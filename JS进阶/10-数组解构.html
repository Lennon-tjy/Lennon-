<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //数组解构：将数组里面的值批量赋值给一系列变量的简洁语法
      const arr = [100, 60, 80];
      //数组解构
      const [max, min, avg] = arr;
      //也可以写成const [max,min,avg] = [100,60,80]

      console.log(max);
      console.log(min);
      console.log(avg);
      console.log(arr);

      //变量交换
      let a = 1;
      let b = 2;
      [b, a] = [a, b];
      console.log(a);
      console.log(b);

      //练习
      const pc = ["海尔", "联想", "小米", "方正"];
      const [hr, lx, mx, fz] = pc;
      console.log(hr);

      //练习
      function getValue() {
        return [100, 60];
      }
      console.log(getValue());
      //要求max变量存100，min变量存60
      const [max1, min1] = getValue();
      console.log(max1);
      console.log(min1);

      //剩余参数
      const [c, d, ...add] = [1, 2, 3, 4, 5];
      console.log(c);
      console.log(d);
      console.log(add); // [3, 4, 5]，数组
      console.log(add[0]);

      //给默认值
      const [m = 0, n = 0] = [100, 200];
      console.log(m);
      console.log(n);

      //按需导入，忽略某些值
      const [i, j, , h] = [1, 2, 3, 4];
      console.log(i); //1
      console.log(j); //2
      console.log(h); //4

      console.log("--------------");

      //多维数组
      const arr1 = [1, 2, [3, 4]];
      console.log(arr1[2][0]); //3

      //多维数组解构
      const [aa, bb, [cc, dd]] = [1, 2, [3, 4]];
      console.log(cc); //3
    </script>
  </body>
</html>
