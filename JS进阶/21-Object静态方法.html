<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const o = {
        uname: "lennon",
        age: 18,
      };

      //获得所有属性名
      console.log(Object.keys(o));

      //获得所有属性值
      console.log(Object.values(o));

      //拷贝对象
      const oo = {};
      //拷贝
      Object.assign(oo, o);
      console.log(oo);

      //拷贝常用于添加属性
      Object.assign(o, { gender: "女" });
      console.log(o);
    </script>
  </body>
</html>
