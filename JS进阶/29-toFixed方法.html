<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //toFixed方法：保留小数位数
      const num = 10.923;
      console.log(num.toFixed()); //11，不写参数，默认是四舍五入
      console.log(num.toFixed(2)); //10.92，保留2位小数

      const num1 = 10;
      console.log(num1.toFixed(2)); //10.00
    </script>
  </body>
</html>
