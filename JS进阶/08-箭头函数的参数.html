<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
  </head>
  <body>
    <script>
      //1.利用箭头函数求和
      //箭头函数里没有arguments动态参数
      const getSum = (...arr) => {
        let sum = 0;
        for (let i = 0; i < arr.length; i++) {
          sum = sum + arr[i];
        }
        return sum;
      };
      const result = getSum(2, 3, 4, 5);
      console.log(result);
    </script>
  </body>
</html>
