<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //高频面试题
      //闭包：内部函数 + 外部函数变量
      //简单写法
      // function outer() {
      //   let a = 10;
      //   function inner() {
      //     console.log(a);
      //   }
      //   inner();
      // }
      // outer();

      //常见闭包形式，外部可以访问函数内部的变量
      function outer() {
        let a = 10;
        function fn() {
          console.log(a);
        }
        return fn; //把fn这个函数本身，作为结果返回出去
      }
      const fun = outer();
      //外面使用这个10
      fun();

      //闭包的应用
      // 统计函数调用次数
      // let i = 0;
      // function fn() {
      //   i++;
      //   console.log(`函数被调用了${i}次`);
      // }
      //i是全局变量，容易被修改

      //闭包形式
      function outer() {
        let i = 0;
        function inner() {
          i++;
          console.log(`函数被调用了${i}次`);
        }
        return inner;
      }
      const fun1 = outer();
      //这个闭包的i不会被回收，会有内存泄漏
    </script>
  </body>
</html>
